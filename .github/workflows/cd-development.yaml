name: wf-cd-development
on:
  push:
    branches:
      - develop
jobs:
  build-development-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: build webite for development
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
      - name: upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
        path: "./dist"
        name: "build-artifact-development"
  deploy-development-job:
    needs: "build-development-job"
    enviroment: "development-env"
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: deploy development artifacts
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "build-artifact-development"
          token: ${{github.token}}